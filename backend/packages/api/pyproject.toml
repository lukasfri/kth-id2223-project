[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Friman", email = "lukas@dreamplay.net" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128.0",
    "openmeteo-requests>=1.7.4",
    "pydantic>=2.12.5",
    "training",
    "uvicorn>=0.34.0",
    "xgboost>=3.1.2",
]

[project.scripts]
api = "api:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
training = { workspace = true }
