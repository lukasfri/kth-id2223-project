[project]
name = "training"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Lukas Friman", email = "lukasfri@kth.se" },
    { name = "Georges Tohme", email = "tohme@kth.se" },
]
requires-python = ">=3.12"
dependencies = [
    "grpcio-tools>=1.76.0",
    "gtfs-kit>=12.0.0",
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
    "mypy-protobuf>=3.7.0",
    "openmeteo-requests>=1.7.4",
    "pandas>=2.3.3",
    "protobuf>=6.33.2",
    "py7zr>=1.0.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "requests-cache>=1.2.1",
    "retry-requests>=2.0.0",
    "scikit-learn>=1.8.0",
    "xgboost>=3.1.2",
]

[project.scripts]
training = "training:main"

[build-system]
requires = ["uv_build>=0.9.17,<0.10.0"]
build-backend = "uv_build"
